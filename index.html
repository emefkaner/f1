<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liga — F1 25 Multiplayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<script>
/* ═══════════════════════════════════════════════════════════════════
   HIER DIE DATEN PFLEGEN — sonst musst du unten nichts anfassen.
   ═══════════════════════════════════════════════════════════════════

   Neues Rennen eintragen:
   1. Block in RACES kopieren, round hochzählen.
   2. results = Reihenfolge im Ziel, von P1 abwärts.
   3. gap = Abstand zum Sieger als Text (beim Sieger die Gesamtzeit).
   4. dnf: true → zählt keine Punkte, landet unten in der Wertung.
   5. fastestLap = Fahrer-ID der schnellsten Runde.

   Punkte: 25-18-15-12-10-8-6-4-2-1.
   FASTEST_LAP_POINT auf true stellen, falls ihr den Extrapunkt fahrt.
*/

const LEAGUE_NAME    = "Feierabend-Liga";
const SEASON         = "Saison 1";
const FASTEST_LAP_POINT = false;   // true = +1 Punkt für schnellste Runde (nur Top 10)

// Platzhalter – durch eure echten Namen/Teams ersetzen
const DRIVERS = [
  { id: "emefka", name: "Emefka", tag: "EMF", team: "Red Bull",     color: "#3671C6" },
  { id: "nico",   name: "Nico",   tag: "NIC", team: "Ferrari",      color: "#E8002D" },
  { id: "timo",   name: "Timo",   tag: "TIM", team: "McLaren",      color: "#FF8000" },
  { id: "lars",   name: "Lars",   tag: "LAR", team: "Mercedes",     color: "#27F4D2" },
  { id: "jana",   name: "Jana",   tag: "JAN", team: "Aston Martin", color: "#229971" },
  { id: "basti",  name: "Basti",  tag: "BAS", team: "Williams",     color: "#64C4FF" },
];

const RACES = [
  {
    round: 1, gp: "Bahrain", circuit: "Sakhir", date: "2026-06-14", laps: 17,
    fastestLap: "nico",
    results: [
      { driver: "emefka", gap: "32:04.581" },
      { driver: "nico",   gap: "+3.412" },
      { driver: "timo",   gap: "+8.907" },
      { driver: "basti",  gap: "+14.220" },
      { driver: "jana",   gap: "+21.883" },
      { driver: "lars",   dnf: true, gap: "Unfall" },
    ]
  },
  {
    round: 2, gp: "Imola", circuit: "Autodromo Enzo e Dino Ferrari", date: "2026-06-21", laps: 16,
    fastestLap: "emefka",
    results: [
      { driver: "timo",   gap: "29:47.118" },
      { driver: "emefka", gap: "+1.044" },
      { driver: "lars",   gap: "+6.510" },
      { driver: "nico",   gap: "+9.771" },
      { driver: "basti",  gap: "+18.302" },
      { driver: "jana",   gap: "+24.665" },
    ]
  },
  {
    round: 3, gp: "Monaco", circuit: "Circuit de Monaco", date: "2026-06-28", laps: 26,
    fastestLap: "lars",
    results: [
      { driver: "nico",   gap: "38:12.900" },
      { driver: "lars",   gap: "+2.187" },
      { driver: "emefka", gap: "+4.339" },
      { driver: "jana",   gap: "+11.052" },
      { driver: "timo",   dnf: true, gap: "Mauer, Runde 9" },
      { driver: "basti",  dnf: true, gap: "Getriebe" },
    ]
  },
  {
    round: 4, gp: "Silverstone", circuit: "Silverstone Circuit", date: "2026-07-05", laps: 15,
    fastestLap: "timo",
    results: [
      { driver: "emefka", gap: "31:20.744" },
      { driver: "timo",   gap: "+0.912" },
      { driver: "basti",  gap: "+7.408" },
      { driver: "nico",   gap: "+12.116" },
      { driver: "lars",   gap: "+15.887" },
      { driver: "jana",   gap: "+29.401" },
    ]
  },
  {
    round: 5, gp: "Spa-Francorchamps", circuit: "Circuit de Spa", date: "2026-07-19", laps: 13,
    fastestLap: "basti",
    results: [
      { driver: "basti",  gap: "34:55.203" },
      { driver: "emefka", gap: "+5.660" },
      { driver: "nico",   gap: "+6.021" },
      { driver: "timo",   gap: "+13.774" },
      { driver: "jana",   gap: "+22.019" },
      { driver: "lars",   gap: "+35.442" },
    ]
  },
];

const TOTAL_ROUNDS = 10;   // geplante Saisonlänge
</script>

<style>
:root{
  --carbon:#0a0a0c;
  --panel:#131317;
  --panel-2:#191920;
  --line:#26262e;
  --red:#e10600;
  --white:#f2f2f4;
  --muted:#8a8a94;
  --purple:#a03cf0;
  --gold:#ffd23f;
  --silver:#c9cbd1;
  --bronze:#c8813f;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Titillium Web","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--carbon);color:var(--white);
  font-family:var(--sans);font-size:16px;line-height:1.45;
  background-image:
    repeating-linear-gradient(115deg,rgba(255,255,255,.014) 0 1px,transparent 1px 9px);
}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 96px}

/* ── Kopf ──────────────────────────────────────────── */
.masthead{padding:48px 0 32px;border-bottom:1px solid var(--line);position:relative}
.masthead::after{content:"";position:absolute;left:0;bottom:-1px;width:112px;height:3px;background:var(--red)}
.eyebrow{
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin:0 0 10px
}
h1{
  margin:0;font-weight:900;font-style:italic;letter-spacing:-.02em;
  font-size:clamp(38px,8.5vw,76px);line-height:.92;text-transform:uppercase
}
h1 .season{display:block;color:var(--red);font-size:.42em;letter-spacing:.04em;margin-top:10px;font-style:normal}
.meta{display:flex;flex-wrap:wrap;gap:26px;margin-top:26px}
.meta div{font-family:var(--mono);font-size:12px;color:var(--muted)}
.meta b{display:block;font-family:var(--sans);font-size:26px;font-weight:700;color:var(--white);line-height:1.1}

/* ── Abschnitte ────────────────────────────────────── */
section{margin-top:56px}
h2{
  margin:0 0 18px;font-size:13px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;display:flex;align-items:center;gap:12px
}
h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* ── Timing Tower ──────────────────────────────────── */
.tower{display:flex;flex-direction:column;gap:3px}
.row{
  display:grid;grid-template-columns:44px 5px 1fr auto auto;align-items:center;
  gap:14px;background:var(--panel);border-radius:2px;padding:0 16px 0 0;min-height:56px;
  transition:background .15s ease
}
.row:hover{background:var(--panel-2)}
.pos{
  font-family:var(--mono);font-weight:700;font-size:17px;text-align:center;
  align-self:stretch;display:flex;align-items:center;justify-content:center;
  background:#000;border-radius:2px 0 0 2px
}
.row.p1 .pos{background:var(--red)}
.spine{align-self:stretch;background:var(--muted)}
.who{min-width:0}
.who .nm{font-weight:700;font-size:17px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .tm{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.gap{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.pts{font-family:var(--mono);font-weight:700;font-size:19px;text-align:right;min-width:52px}
.pts small{font-size:10px;color:var(--muted);font-weight:400;display:block;letter-spacing:.1em}

/* ── Ergebnis-Matrix ───────────────────────────────── */
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:2px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:13px}
th,td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{
  background:#000;font-family:var(--sans);font-size:10px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);position:sticky;top:0
}
tbody th{
  text-align:left;font-family:var(--sans);font-weight:700;font-size:14px;
  padding-left:14px;background:var(--panel);position:sticky;left:0;
  border-left:3px solid var(--muted);min-width:132px
}
.cell{color:var(--muted)}
.cell.p1{background:rgba(255,210,63,.14);color:var(--gold);font-weight:700}
.cell.p2{background:rgba(201,203,209,.12);color:var(--silver);font-weight:700}
.cell.p3{background:rgba(200,129,63,.14);color:var(--bronze);font-weight:700}
.cell.pts-in{color:var(--white)}
.cell.out{color:#55555e}
.total{background:#000;font-weight:700;color:var(--white)}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:none}

/* ── Rennen ────────────────────────────────────────── */
.rounds{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.chip{
  flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);
  font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 15px;border-radius:2px;cursor:pointer;transition:.15s ease
}
.chip:hover{color:var(--white);border-color:#3a3a44}
.chip[aria-selected="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip:focus-visible,.row:focus-visible{outline:2px solid var(--white);outline-offset:2px}
.racehead{display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;margin-bottom:16px}
.racehead h3{margin:0;font-size:27px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-.01em}
.racehead span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.fl{color:var(--purple);font-weight:700}
.row.dnf .pos{background:#1c1c22;color:#5a5a64}
.row.dnf .nm{color:var(--muted)}

footer{margin-top:72px;padding-top:22px;border-top:1px solid var(--line);font-size:11px;color:#55555e;line-height:1.7}

@media (max-width:620px){
  .row{grid-template-columns:38px 4px 1fr auto;gap:10px;padding-right:12px}
  .gap{display:none}
  .meta{gap:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">F1 25 · Multiplayer</p>
    <h1 id="title">Liga<span class="season">Saison</span></h1>
    <div class="meta">
      <div><b id="m-rounds">0</b>Rennen gefahren</div>
      <div><b id="m-leader">–</b>Führung</div>
      <div><b id="m-drivers">0</b>Fahrer</div>
      <div><b id="m-next">–</b>Nächster Lauf</div>
    </div>
  </header>

  <section>
    <h2>Fahrerwertung</h2>
    <div class="tower" id="tower"></div>
  </section>

  <section>
    <h2>Saisonübersicht</h2>
    <div class="scroller"><table id="matrix"></table></div>
  </section>

  <section>
    <h2>Rennergebnisse</h2>
    <div class="rounds" id="rounds" role="tablist"></div>
    <div id="race"></div>
  </section>

  <footer>
    Private Liga-Auswertung zu F1&nbsp;25. Keine Verbindung zur Formula One Group, EA oder Codemasters.<br>
    Punkte nach 25-18-15-12-10-8-6-4-2-1<span id="flnote"></span>.
  </footer>
</div>

<script>
const POINTS = [25,18,15,12,10,8,6,4,2,1];
const D = Object.fromEntries(DRIVERS.map(d => [d.id, d]));
const $ = s => document.querySelector(s);

/* Punkte eines Rennens berechnen */
function racePoints(race){
  const out = {};
  let pos = 0;
  race.results.forEach(r => {
    if (r.dnf) return;
    const p = POINTS[pos] ?? 0;
    out[r.driver] = { pos: ++pos && pos, points: p };
  });
  if (FASTEST_LAP_POINT && race.fastestLap && out[race.fastestLap]?.pos <= 10){
    out[race.fastestLap].points += 1;
    out[race.fastestLap].fl = true;
  } else if (race.fastestLap && out[race.fastestLap]){
    out[race.fastestLap].fl = true;
  }
  return out;
}

const PTS_BY_RACE = RACES.map(racePoints);

/* Gesamtwertung */
function standings(){
  const t = DRIVERS.map(d => ({ ...d, points:0, wins:0, podiums:0, fls:0, best:99 }));
  const by = Object.fromEntries(t.map(x => [x.id, x]));
  RACES.forEach((race, i) => {
    Object.entries(PTS_BY_RACE[i]).forEach(([id, r]) => {
      const e = by[id]; if (!e) return;
      e.points += r.points;
      if (r.pos === 1) e.wins++;
      if (r.pos <= 3) e.podiums++;
      if (r.fl) e.fls++;
      e.best = Math.min(e.best, r.pos);
    });
  });
  return t.sort((a,b) => b.points - a.points || b.wins - a.wins || a.best - b.best);
}

/* Kopfzahlen */
function renderHead(){
  const s = standings();
  $("#title").innerHTML = LEAGUE_NAME + '<span class="season">' + SEASON + '</span>';
  document.title = LEAGUE_NAME + " — F1 25";
  $("#m-rounds").textContent = RACES.length + " / " + TOTAL_ROUNDS;
  $("#m-leader").textContent = s[0]?.name ?? "–";
  $("#m-drivers").textContent = DRIVERS.length;
  $("#m-next").textContent = "Runde " + (RACES.length + 1);
  $("#flnote").textContent = FASTEST_LAP_POINT ? ", +1 für die schnellste Runde" : "";
}

/* Fahrerwertung als Timing Tower */
function renderTower(){
  const s = standings();
  const lead = s[0]?.points ?? 0;
  $("#tower").innerHTML = s.map((d,i) => `
    <div class="row ${i===0?"p1":""}">
      <div class="pos">${i+1}</div>
      <div class="spine" style="background:${d.color}"></div>
      <div class="who">
        <div class="nm">${d.name}</div>
        <div class="tm">${d.team}</div>
      </div>
      <div class="gap">${i===0 ? `${d.wins} Siege · ${d.podiums} Podien` : "−" + (lead - d.points)}</div>
      <div class="pts">${d.points}<small>PKT</small></div>
    </div>`).join("");
}

/* Saison-Matrix */
function renderMatrix(){
  const s = standings();
  const head = RACES.map(r => `<th title="${r.gp}">R${r.round}</th>`).join("");
  const body = s.map(d => {
    const cells = RACES.map((r,i) => {
      const e = PTS_BY_RACE[i][d.id];
      if (!e){
        const dnf = r.results.find(x => x.driver === d.id && x.dnf);
        return `<td class="cell out">${dnf ? "DNF" : "–"}</td>`;
      }
      const cls = e.pos<=3 ? "p"+e.pos : (e.points>0 ? "pts-in" : "");
      return `<td class="cell ${cls}">${e.pos}</td>`;
    }).join("");
    return `<tr>
      <th style="border-left-color:${d.color}">${d.name}</th>
      ${cells}<td class="total">${d.points}</td></tr>`;
  }).join("");
  $("#matrix").innerHTML =
    `<thead><tr><th style="text-align:left;padding-left:14px">Fahrer</th>${head}<th>PKT</th></tr></thead>
     <tbody>${body}</tbody>`;
}

/* Einzelrennen */
function renderRace(idx){
  const r = RACES[idx];
  const pts = PTS_BY_RACE[idx];
  document.querySelectorAll(".chip").forEach((c,i) =>
    c.setAttribute("aria-selected", String(i === idx)));

  const rows = r.results.map((res, i) => {
    const d = D[res.driver] || { name: res.driver, team: "?", color: "#555" };
    const e = pts[res.driver];
    const isFl = r.fastestLap === res.driver;
    return `<div class="row ${res.dnf ? "dnf" : ""} ${i===0 && !res.dnf ? "p1" : ""}">
      <div class="pos">${res.dnf ? "–" : e.pos}</div>
      <div class="spine" style="background:${d.color}"></div>
      <div class="who">
        <div class="nm">${d.name}${isFl ? ' <span class="fl">FL</span>' : ""}</div>
        <div class="tm">${d.team}</div>
      </div>
      <div class="gap">${res.dnf ? (res.gap || "DNF") : (res.gap || "")}</div>
      <div class="pts">${res.dnf ? 0 : e.points}<small>PKT</small></div>
    </div>`;
  }).join("");

  const date = new Date(r.date + "T12:00:00")
    .toLocaleDateString("de-DE", { day:"2-digit", month:"long", year:"numeric" });

  $("#race").innerHTML = `
    <div class="racehead">
      <h3>${r.gp}</h3>
      <span>${r.circuit} · ${r.laps} Runden · ${date}</span>
    </div>
    <div class="tower">${rows}</div>`;
}

function renderRounds(){
  $("#rounds").innerHTML = RACES.map((r,i) =>
    `<button class="chip" role="tab" aria-selected="false">R${r.round} ${r.gp}</button>`).join("");
  document.querySelectorAll(".chip").forEach((c,i) =>
    c.addEventListener("click", () => renderRace(i)));
}

renderHead();
renderTower();
renderMatrix();
renderRounds();
renderRace(RACES.length - 1);
</script>
</body>
</html>
